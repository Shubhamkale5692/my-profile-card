<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Profile Card — ApnoAI Task 2</title>

  <!-- Google Fonts: Plus Jakarta Sans for modern, clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (for in-browser JSX compilation) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
          },
          animation: {
            'float-slow': 'float 8s ease-in-out infinite',
            'float-reverse': 'floatReverse 9s ease-in-out infinite',
            'pulse-subtle': 'pulseSubtle 4s ease-in-out infinite',
            'card-entrance': 'cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(-18px) rotate(3deg)' },
            },
            floatReverse: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(16px) rotate(-3deg)' },
            },
            pulseSubtle: {
              '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
              '50%': { opacity: '0.65', transform: 'scale(1.05)' },
            },
            cardEntrance: {
              '0%': { opacity: '0', transform: 'translateY(24px) scale(0.96)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
          },
        },
      },
    };
  </script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Premium Glassmorphism Styles */
    .glass-card-light {
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: 
        0 25px 50px -12px rgba(15, 23, 42, 0.18),
        0 0 0 1px rgba(255, 255, 255, 0.3) inset,
        0 10px 30px -10px rgba(236, 72, 153, 0.2);
    }

    .glass-card-dark {
      background: rgba(17, 24, 39, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 10px 35px -10px rgba(124, 58, 237, 0.25);
    }

    .glass-pill-light {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .glass-pill-dark {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .glass-button-light {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .glass-button-dark {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    /* Subtle custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // =========================================================================
    // SVG ICONS (Clean, lightweight, modern vector graphics)
    // =========================================================================
    
    // Sun Icon for Theme Toggle
    function SunIcon({ className = "w-5 h-5" }) {
      return (
        <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="5" fill="currentColor" fillOpacity="0.2"></circle>
          <path strokeLinecap="round" strokeLinejoin="round" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
      );
    }

    // Moon Icon for Theme Toggle
    function MoonIcon({ className = "w-5 h-5" }) {
      return (
        <svg className={className} fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21.64 13a1 1 0 0 0-1.05-.14 8.05 8.05 0 0 1-3.37.73A8.15 8.15 0 0 1 9.08 5.49a8.59 8.59 0 0 1 .25-2A1 1 0 0 0 8 2.36a10.14 10.14 0 1 0 14 11.69 1 1 0 0 0-.36-1.05z" />
        </svg>
      );
    }

    // GitHub Icon
    function GitHubIcon({ className = "w-5 h-5" }) {
      return (
        <svg className={className} fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
        </svg>
      );
    }

    // Twitter / X Icon
    function TwitterIcon({ className = "w-5 h-5" }) {
      return (
        <svg className={className} fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      );
    }

    // LinkedIn Icon
    function LinkedInIcon({ className = "w-5 h-5" }) {
      return (
        <svg className={className} fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
      );
    }

    // Checkmark Icon for Connected State
    function CheckIcon({ className = "w-5 h-5" }) {
      return (
        <svg className={className} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24" aria-hidden="true">
          <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" />
        </svg>
      );
    }

    // User Plus Icon for Connect State
    function UserPlusIcon({ className = "w-5 h-5" }) {
      return (
        <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
          <path strokeLinecap="round" strokeLinejoin="round" d="M19 7.5v6m3-3h-6m-1.5-3a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 21.75c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695z" />
        </svg>
      );
    }

    // =========================================================================
    // 1. REUSABLE PROFILE CARD COMPONENT
    // =========================================================================
    // Component accepting props:
    // - name (string): Full name of the person
    // - role (string): Professional role / headline
    // - bio (string): Personal summary / bio
    // - skills (array of strings): Skills list
    // - avatar (string): URL to profile picture
    // - github (string): GitHub profile link (optional)
    // - twitter (string): Twitter/X profile link (optional)
    // - linkedin (string): LinkedIn profile link (optional)
    
    function ProfileCard({ 
      name, 
      role, 
      bio, 
      skills = [], 
      avatar, 
      github, 
      twitter, 
      linkedin 
    }) {
      // -----------------------------------------------------------------------
      // REACT STATE MANAGEMENT
      // -----------------------------------------------------------------------
      // isDark: Controls Light Mode / Dark Mode theme
      const [isDark, setIsDark] = useState(false);

      // isConnected: Controls Connect Button interactive toggle state
      const [isConnected, setIsConnected] = useState(false);

      // Event handlers
      const toggleTheme = () => setIsDark(prev => !prev);
      const toggleConnect = () => setIsConnected(prev => !prev);

      return (
        <main 
          className={`min-h-screen w-full relative flex items-center justify-center p-4 sm:p-6 md:p-8 transition-colors duration-500 selection:bg-purple-500 selection:text-white ${
            isDark 
              ? 'bg-gray-900 text-gray-100' 
              : 'bg-gradient-to-br from-purple-500 via-pink-500 to-orange-400 text-gray-900'
          }`}
        >
          {/* ================================================================= */}
          {/* AMBIENT BACKGROUND GLOW ORBS (Creates authentic glass refraction)  */}
          {/* ================================================================= */}
          <div className="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
            {/* Top-left orb */}
            <div 
              className={`absolute -top-24 -left-20 w-80 h-80 sm:w-96 sm:h-96 rounded-full blur-3xl transition-opacity duration-700 animate-float-slow ${
                isDark 
                  ? 'bg-purple-700/25 opacity-70' 
                  : 'bg-purple-300/60 opacity-80'
              }`}
            />
            {/* Bottom-right orb */}
            <div 
              className={`absolute -bottom-24 -right-20 w-80 h-80 sm:w-96 sm:h-96 rounded-full blur-3xl transition-opacity duration-700 animate-float-reverse ${
                isDark 
                  ? 'bg-pink-700/20 opacity-60' 
                  : 'bg-yellow-300/50 opacity-80'
              }`}
            />
            {/* Center-accent orb */}
            <div 
              className={`absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full blur-3xl transition-opacity duration-700 animate-pulse-subtle ${
                isDark 
                  ? 'bg-indigo-600/20 opacity-50' 
                  : 'bg-pink-400/40 opacity-70'
              }`}
            />
          </div>

          {/* ================================================================= */}
          {/* 7. THEME TOGGLE BUTTON (Fixed in Top-Right Corner)                */}
          {/* ================================================================= */}
          <header className="fixed top-4 right-4 sm:top-6 sm:right-6 z-50">
            <button
              onClick={toggleTheme}
              aria-label={isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'}
              title={isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'}
              className={`group relative p-3 sm:p-3.5 rounded-full transition-all duration-300 transform hover:scale-110 active:scale-95 shadow-lg flex items-center justify-center ${
                isDark 
                  ? 'glass-button-dark text-yellow-300 hover:text-yellow-200 hover:border-yellow-400/50 shadow-yellow-500/10' 
                  : 'glass-button-light text-slate-800 hover:text-purple-900 hover:border-white shadow-purple-900/10'
              }`}
            >
              {/* Moon icon for Dark Mode, Sun icon for Light Mode */}
              {isDark ? (
                <SunIcon className="w-5 h-5 sm:w-6 sm:h-6 transition-transform duration-300 group-hover:rotate-45" />
              ) : (
                <MoonIcon className="w-5 h-5 sm:w-6 sm:h-6 transition-transform duration-300 group-hover:-rotate-12" />
              )}

              {/* Tooltip on hover */}
              <span className={`pointer-events-none absolute right-full mr-3 whitespace-nowrap rounded-lg px-2.5 py-1 text-xs font-medium tracking-wide shadow-md opacity-0 group-hover:opacity-100 transition-opacity duration-200 ${
                isDark ? 'bg-gray-800 text-gray-200 border border-gray-700' : 'bg-white/95 text-gray-800 border border-white shadow-lg'
              }`}>
                {isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'}
              </span>
            </button>
          </header>

          {/* ================================================================= */}
          {/* 2. MAIN PROFILE CARD CONTAINER (Premium Glassmorphism Design)     */}
          {/* ================================================================= */}
          <article 
            className={`relative w-full max-w-md rounded-3xl p-6 sm:p-8 transition-all duration-500 animate-card-entrance z-10 ${
              isDark ? 'glass-card-dark' : 'glass-card-light'
            }`}
          >
            {/* Top decorative glass shine pill */}
            <div className="flex justify-center mb-4">
              <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase transition-colors ${
                isDark 
                  ? 'bg-purple-500/15 text-purple-300 border border-purple-500/25' 
                  : 'bg-white/50 text-purple-900 border border-white/60 shadow-sm'
              }`}>
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Available for Projects
              </span>
            </div>

            {/* =============================================================== */}
            {/* 3. PROFILE AVATAR SECTION                                       */}
            {/* =============================================================== */}
            <div className="flex justify-center mb-5">
              <div className="relative group">
                {/* Subtle ambient avatar glow */}
                <div 
                  className={`absolute -inset-1 rounded-full blur-md opacity-60 group-hover:opacity-100 transition duration-500 ${
                    isDark ? 'bg-gradient-to-r from-purple-600 to-pink-600' : 'bg-gradient-to-r from-white to-pink-200'
                  }`}
                  aria-hidden="true"
                />

                {/* Avatar Image */}
                <img
                  src={avatar}
                  alt={name}
                  className="relative w-32 h-32 sm:w-36 sm:h-36 rounded-full object-cover border-4 border-white/70 shadow-2xl transition-all duration-500 transform group-hover:scale-105 group-hover:rotate-1"
                  loading="lazy"
                />

                {/* Verified / Active status badge */}
                <span 
                  className="absolute bottom-1 right-2 w-5 h-5 rounded-full bg-emerald-500 border-2 border-white shadow-md flex items-center justify-center text-white text-[10px]"
                  title="Verified Profile"
                >
                  ✓
                </span>
              </div>
            </div>

            {/* =============================================================== */}
            {/* 4. NAME AND ROLE SECTION                                        */}
            {/* =============================================================== */}
            <div className="text-center mb-4">
              <h1 className={`text-2xl sm:text-3xl font-extrabold tracking-tight mb-1.5 transition-colors ${
                isDark ? 'text-white' : 'text-slate-900'
              }`}>
                {name}
              </h1>

              <div className="flex justify-center">
                <p className={`text-sm sm:text-base font-semibold px-3.5 py-0.5 rounded-full inline-block transition-colors ${
                  isDark 
                    ? 'text-purple-300 bg-purple-950/40 border border-purple-800/40' 
                    : 'text-purple-950 bg-white/40 border border-white/50 shadow-sm'
                }`}>
                  {role}
                </p>
              </div>
            </div>

            {/* =============================================================== */}
            {/* 5. BIO SECTION                                                  */}
            {/* =============================================================== */}
            <p className={`text-center text-sm sm:text-base leading-relaxed mb-6 px-1 transition-colors ${
              isDark ? 'text-gray-300' : 'text-slate-800 font-medium'
            }`}>
              {bio}
            </p>

            {/* =============================================================== */}
            {/* 6. SKILLS SECTION (Dynamic rendering using JavaScript map())     */}
            {/* =============================================================== */}
            {skills && skills.length > 0 && (
              <section aria-label="Skills & Expertise" className="mb-6">
                <div className="flex flex-wrap gap-2 justify-center">
                  {skills.map((skill, index) => (
                    <span
                      key={index}
                      className={`px-3.5 py-1 rounded-full text-xs sm:text-sm font-semibold tracking-wide cursor-default transition-all duration-300 transform hover:-translate-y-0.5 hover:scale-105 ${
                        isDark
                          ? 'glass-pill-dark text-purple-200 hover:text-white hover:border-purple-400/50 hover:shadow-purple-500/20 hover:shadow-md'
                          : 'glass-pill-light text-slate-800 hover:text-purple-950 hover:bg-white/80 hover:border-white hover:shadow-md'
                      }`}
                    >
                      {skill}
                    </span>
                  ))}
                </div>
              </section>
            )}

            {/* =============================================================== */}
            {/* 8. CONNECT BUTTON (Interactive React State Toggle)              */}
            {/* =============================================================== */}
            <div className="mb-6">
              <button
                onClick={toggleConnect}
                type="button"
                className={`w-full py-3.5 px-6 rounded-2xl font-bold text-sm sm:text-base tracking-wide flex items-center justify-center gap-2 transition-all duration-300 transform active:scale-95 shadow-lg ${
                  isConnected
                    ? 'bg-green-500 hover:bg-green-600 text-white shadow-green-500/35'
                    : isDark
                    ? 'bg-white text-gray-900 hover:bg-gray-100 shadow-white/10'
                    : 'bg-gray-900 text-white hover:bg-gray-800 shadow-gray-900/25'
                }`}
                aria-pressed={isConnected}
              >
                {isConnected ? '✓ Connected' : 'Connect'}
              </button>
            </div>

            {/* =============================================================== */}
            {/* 9. SOCIAL MEDIA LINKS (Conditionally rendered when URL provided)*/}
            {/* =============================================================== */}
            <nav aria-label="Social Profiles" className="flex justify-center items-center gap-3 sm:gap-4 mb-6">
              {/* GitHub Link */}
              {github && (
                <a
                  href={github}
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label={`${name}'s GitHub Profile`}
                  title="Visit GitHub Profile"
                  className={`p-3 rounded-full transition-all duration-300 transform hover:scale-110 active:scale-95 shadow-md flex items-center justify-center ${
                    isDark 
                      ? 'glass-button-dark text-gray-200 hover:text-white hover:border-white/40 hover:bg-white/20' 
                      : 'glass-button-light text-slate-800 hover:text-black hover:border-white hover:bg-white/80'
                  }`}
                >
                  <GitHubIcon className="w-5 h-5" />
                </a>
              )}

              {/* Twitter / X Link */}
              {twitter && (
                <a
                  href={twitter}
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label={`${name}'s Twitter / X Profile`}
                  title="Visit Twitter / X Profile"
                  className={`p-3 rounded-full transition-all duration-300 transform hover:scale-110 active:scale-95 shadow-md flex items-center justify-center ${
                    isDark 
                      ? 'glass-button-dark text-gray-200 hover:text-sky-300 hover:border-sky-400/40 hover:bg-sky-500/10' 
                      : 'glass-button-light text-slate-800 hover:text-sky-600 hover:border-white hover:bg-white/80'
                  }`}
                >
                  <TwitterIcon className="w-5 h-5" />
                </a>
              )}

              {/* LinkedIn Link */}
              {linkedin && (
                <a
                  href={linkedin}
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label={`${name}'s LinkedIn Profile`}
                  title="Visit LinkedIn Profile"
                  className={`p-3 rounded-full transition-all duration-300 transform hover:scale-110 active:scale-95 shadow-md flex items-center justify-center ${
                    isDark 
                      ? 'glass-button-dark text-gray-200 hover:text-blue-300 hover:border-blue-400/40 hover:bg-blue-500/10' 
                      : 'glass-button-light text-slate-800 hover:text-blue-600 hover:border-white hover:bg-white/80'
                  }`}
                >
                  <LinkedInIcon className="w-5 h-5" />
                </a>
              )}
            </nav>

            {/* =============================================================== */}
            {/* 10. FOOTER SECTION                                              */}
            {/* =============================================================== */}
            <footer className={`pt-4 border-t text-center transition-colors ${
              isDark ? 'border-white/10' : 'border-white/30'
            }`}>
              <p className={`text-xs font-medium tracking-wide transition-colors ${
                isDark ? 'text-gray-400' : 'text-slate-700'
              }`}>
                Built with React 18 + Tailwind CSS · ApnoAI Task 2
              </p>
            </footer>
          </article>
        </main>
      );
    }

    // =========================================================================
    // 14. ✏️ PERSONAL PROFILE INFORMATION
    // =========================================================================
    // Personal information and verified profile details for Shubham Kale.
    // =========================================================================
    
    const studentProfileData = {
      name: "Shubham Kale",
      role: "Full-Stack Developer",
      bio: "I'm an aspiring Full-Stack Developer passionate about building modern, responsive, and user-friendly web applications. I'm also interested in exploring Web3 technologies and blockchain development.",
      skills: ["React.js", "JavaScript", "HTML5", "CSS3", "Node.js", "Git", "GitHub"],
      avatar: "profile image.jpeg",
      github: "https://github.com/Shubhamkale5692",
      twitter: "https://x.com/Shubham_5692",
      linkedin: "https://www.linkedin.com/in/shubham-kale-162a23322"
    };

    // =========================================================================
    // 13. RENDER ROOT USING REACT 18
    // =========================================================================
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);

    root.render(
      <ProfileCard
        name={studentProfileData.name}
        role={studentProfileData.role}
        bio={studentProfileData.bio}
        skills={studentProfileData.skills}
        avatar={studentProfileData.avatar}
        github={studentProfileData.github}
        twitter={studentProfileData.twitter}
        linkedin={studentProfileData.linkedin}
      />
    );
  </script>
</body>
</html>
